<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Ponto Phenom</title>

<link rel="icon" href="icon-192.png" type="image/png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="manifest" href="manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Ponto Phenom" />
<meta name="theme-color" content="#16241c" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg: #f4f1ea;
    --ink: #2b2a25;
    --ink-dim: #8c8570;
    --line: #d8d2c2;
    --line-strong: #b9b19b;
    --dark: #16241c;
    --dark-text: #f4f1ea;
    --accent: #c9762f;
    --danger: #a8433a;
    --danger-bg: #f6e3df;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'Space Mono', 'Courier New', monospace;
    min-height: 100vh;
    padding-bottom: 76px;
  }

  header{
    padding: 28px 20px 14px;
    text-align: center;
  }
  header .title{
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.08em;
  }
  header .subtitle{
    font-size: 12px;
    color: var(--ink-dim);
    margin-top: 6px;
  }

  .dashed{
    border: none;
    border-top: 1px dashed var(--line-strong);
    margin: 16px 20px;
  }
  .solid-line{
    border: none;
    border-top: 1px solid var(--line);
    margin: 0;
  }

  #status-line{
    display: none;
    margin: 0 20px 14px;
    padding: 10px 12px;
    border: 1px solid var(--danger);
    background: var(--danger-bg);
    color: var(--danger);
    font-size: 12px;
    border-radius: 8px;
    line-height: 1.5;
  }
  #status-line.show{ display: block; }
  #status-line.ok{
    border-color: #6f8f6a;
    background: #e7efe3;
    color: #3f5c3a;
  }

  main{ max-width: 540px; margin: 0 auto; padding: 0 20px; }

  nav.tabs{
    display: flex;
    justify-content: center;
    gap: 18px;
    font-size: 12px;
    letter-spacing: 0.06em;
    color: var(--ink-dim);
    margin-bottom: 6px;
  }
  nav.tabs button{
    background: none;
    border: none;
    font-family: inherit;
    font-size: 12px;
    letter-spacing: 0.06em;
    color: var(--ink-dim);
    cursor: pointer;
    padding: 6px 2px;
    border-bottom: 2px solid transparent;
  }
  nav.tabs button.active{
    color: var(--ink);
    font-weight: 700;
    border-bottom-color: var(--accent);
  }

  .week-nav{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin: 18px 0 4px;
  }
  .sq-btn{
    width: 32px; height: 32px;
    border: 1px solid var(--line-strong);
    background: var(--bg);
    color: var(--ink);
    border-radius: 6px;
    font-family: inherit;
    font-size: 16px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .sq-btn:active{ background: var(--line); }
  .week-label{
    font-size: 13px;
    text-align: center;
    min-width: 200px;
  }

  .pill-btn{
    display: block;
    margin: 12px auto 22px;
    border: 1px dashed var(--line-strong);
    background: transparent;
    color: var(--ink-dim);
    font-family: inherit;
    font-size: 12px;
    padding: 8px 16px;
    border-radius: 20px;
    cursor: pointer;
  }
  .pill-btn:active{ background: var(--line); }

  .day-block{ margin-bottom: 22px; }
  .day-header{
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.08em;
    margin-bottom: 8px;
  }
  .row{
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 9px 0;
    border-bottom: 1px solid var(--line);
  }
  .row:last-child{ border-bottom: none; }

  .box{
    width: 18px; height: 18px;
    border: 1.5px solid var(--ink-dim);
    border-radius: 3px;
    flex-shrink: 0;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .box.checked{ background: var(--dark); border-color: var(--dark); }
  .box svg{ display:none; width: 12px; height: 12px; }
  .box.checked svg{ display: block; }

  .row-name{ flex: 1; font-size: 14px; }
  .row-name.dim{ color: var(--ink-dim); }

  .horas-field{
    width: 54px;
    text-align: right;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--line-strong);
    font-family: inherit;
    font-size: 14px;
    color: var(--ink);
    padding: 2px 2px;
    opacity: 0.3;
    pointer-events: none;
  }
  .horas-field.active{ opacity: 1; pointer-events: auto; }
  .horas-field:focus{ outline: none; border-bottom-color: var(--dark); }
  .row-hint{ font-size: 12px; color: var(--ink-dim); }

  .empty{
    text-align: center;
    color: var(--ink-dim);
    font-size: 13px;
    padding: 22px 10px;
  }

  .weekly-total-row{
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 8px 0;
    border-bottom: 1px solid var(--line);
    font-size: 13px;
  }
  .weekly-total-row:last-child{ border-bottom: none; }
  .weekly-total-row .val{ font-variant-numeric: tabular-nums; white-space: nowrap; }

  .month-box{
    background: var(--dark);
    color: var(--dark-text);
    border-radius: 12px;
    padding: 18px 20px;
    margin: 18px 0 24px;
  }
  .month-box .eyebrow{
    color: var(--accent);
    font-size: 11px;
    letter-spacing: 0.14em;
    margin-bottom: 10px;
  }
  .month-row{
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 7px 0;
    border-bottom: 1px solid rgba(244,241,234,0.15);
    font-size: 14px;
  }
  .month-row:last-child{ border-bottom: none; }
  .month-row .val{ font-variant-numeric: tabular-nums; white-space: nowrap; }
  .month-total{
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed rgba(244,241,234,0.3);
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: rgba(244,241,234,0.7);
  }

  .section-title{
    font-size: 12px;
    letter-spacing: 0.08em;
    color: var(--ink-dim);
    margin: 4px 0 12px;
  }

  input[type="month"]{
    background: var(--bg);
    border: 1px solid var(--line-strong);
    color: var(--ink);
    border-radius: 6px;
    padding: 9px 10px;
    font-size: 14px;
    font-family: inherit;
    width: 100%;
  }
  input[type="text"], input[type="number"]{
    background: var(--bg);
    border: 1px solid var(--line-strong);
    color: var(--ink);
    border-radius: 6px;
    padding: 9px 10px;
    font-size: 14px;
    font-family: inherit;
  }

  .add-row{ display: flex; gap: 8px; margin-bottom: 18px; }
  .add-row input{ flex: 1; }
  .add-row button{
    background: var(--dark);
    color: var(--dark-text);
    border: none;
    border-radius: 6px;
    padding: 0 16px;
    font-family: inherit;
    font-weight: 700;
    cursor: pointer;
  }

  .manage-row{
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 9px 0;
    border-bottom: 1px solid var(--line);
    font-size: 14px;
  }
  .manage-row:last-child{ border-bottom: none; }
  .link-btn{
    background: none;
    border: none;
    font-family: inherit;
    font-size: 12px;
    color: var(--danger);
    text-decoration: underline;
    cursor: pointer;
    padding: 4px;
  }
  .link-btn.muted{ color: var(--accent); }

  .archived-toggle{
    font-size: 12px;
    color: var(--ink-dim);
    text-decoration: underline;
    cursor: pointer;
    margin-top: 4px;
  }

  table.resumo{
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    margin-bottom: 6px;
  }
  table.resumo th{
    text-align: left;
    color: var(--ink-dim);
    font-weight: 400;
    font-size: 11px;
    letter-spacing: 0.05em;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--line-strong);
  }
  table.resumo td{
    padding: 8px 0;
    border-bottom: 1px solid var(--line);
  }
  table.resumo td.num{ text-align: right; font-variant-numeric: tabular-nums; }

  .whatsapp-btn{
    display: block;
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--line-strong);
    color: var(--ink);
    font-family: inherit;
    font-size: 13px;
    padding: 12px;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 30px;
  }

  nav.tabbar{
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--bg);
    border-top: 1px solid var(--line-strong);
    display: flex;
    justify-content: center;
    gap: 26px;
    padding: 12px 8px calc(12px + env(safe-area-inset-bottom));
  }
  nav.tabbar button{
    background: none;
    border: none;
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--ink-dim);
    cursor: pointer;
    padding: 4px 2px;
  }
  nav.tabbar button.active{ color: var(--dark); font-weight: 700; }
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="title">🕐 PONTO PHENOM</div>
    <div class="subtitle" id="valor-hora-display"></div>
  </header>

  <div id="status-line"></div>

  <hr class="dashed" />

  <main>
    <!-- REGISTRAR -->
    <section id="tab-registrar">
      <div class="week-nav">
        <button class="sq-btn" onclick="mudarSemana(-1)">‹</button>
        <div class="week-label" id="semana-label"></div>
        <button class="sq-btn" onclick="mudarSemana(1)">›</button>
      </div>
      <button class="pill-btn" onclick="voltarSemanaAtual()">voltar para semana atual</button>

      <div id="semana-dias"></div>

      <div class="section-title">TOTAL DA SEMANA POR PROFESSOR</div>
      <div id="totais-semana" style="margin-bottom: 30px;"></div>
    </section>

    <!-- PROFESSORES -->
    <section id="tab-professores" style="display:none;">
      <div class="section-title">ADICIONAR PROFESSOR</div>
      <div class="add-row">
        <input type="text" id="novo-professor-nome" placeholder="Nome do professor" />
        <button onclick="adicionarProfessor()">+</button>
      </div>

      <div id="lista-professores-ativos"></div>
      <div class="archived-toggle" id="toggle-arquivados" onclick="toggleArquivados()">Ver professores arquivados</div>
      <div id="lista-professores-arquivados" style="display:none;"></div>

      <hr class="dashed" />

      <div class="section-title">VALOR POR HORA (TODOS OS PROFESSORES)</div>
      <div class="add-row" style="margin-bottom: 30px;">
        <input type="number" id="valor-hora-input" step="0.5" min="0" />
        <button onclick="salvarValorHora()">✓</button>
      </div>
    </section>

    <!-- RESUMO -->
    <section id="tab-resumo" style="display:none;">
      <div class="section-title">MÊS</div>
      <input type="month" id="mes-resumo" style="margin-bottom: 18px;" />

      <div class="month-box">
        <div class="eyebrow" id="resumo-mes-label">RESUMO DO MÊS</div>
        <div id="resumo-lista"></div>
        <div class="month-total">
          <span>total geral da escola</span>
          <span id="total-geral-valor">R$ 0,00</span>
        </div>
      </div>

      <button class="whatsapp-btn" onclick="copiarResumoWhatsapp()">Copiar resumo para WhatsApp</button>
    </section>
  </main>

  <nav class="tabbar">
    <button class="active" data-tab="registrar" onclick="mudarTab('registrar')">REGISTRAR</button>
    <button data-tab="professores" onclick="mudarTab('professores')">PROFESSORES</button>
    <button data-tab="resumo" onclick="mudarTab('resumo')">RESUMO</button>
  </nav>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js", { updateViaCache: "none" }).catch(()=>{}));
}

// ---------- STATUS BANNER ----------
function showStatus(msg, kind){
  const el = document.getElementById("status-line");
  el.textContent = msg;
  el.classList.remove("ok");
  if (kind === "ok") el.classList.add("ok");
  el.classList.add("show");
}
function hideStatus(){
  const el = document.getElementById("status-line");
  el.classList.remove("show");
}

// ---------- STATE ----------
let professores = [];
let valorHora = 25;
let semanaOffset = 0;
const DIAS_SEMANA = ["DOMINGO","SEGUNDA","TERÇA","QUARTA","QUINTA","SEXTA","SÁBADO"];
const NOMES_MES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];

function mesStr(){
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
}
let mesAtual = mesStr();

// ---------- FIREBASE SETUP ----------
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBDvBP9ycd3Zfj3yHDw03BrCXjmJNAp4xA",
  authDomain: "phenom-ponto.firebaseapp.com",
  projectId: "phenom-ponto",
  storageBucket: "phenom-ponto.firebasestorage.app",
  messagingSenderId: "975759698842",
  appId: "1:975759698842:web:0bd5ecba80b756c88d2823"
};

let db;

(function boot(){
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.firestore();
    startApp();
    // Teste de escrita real, pra confirmar que as regras do Firestore permitem gravar.
    db.collection("phenomPonto_diagnostico").doc("teste").set({ ok: true, quando: Date.now() })
      .then(()=> hideStatus())
      .catch((e)=> showStatus("Erro de permissão no Firestore: " + e.message + " — verifique se a regra 'allow read, write: if true;' foi publicada.", "error"));
  }catch(e){
    showStatus("Não consegui conectar ao Firebase: " + e.message, "error");
  }
})();

function dateToStr(d){
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function getSegundaDaSemana(date){
  const d = new Date(date);
  const dia = d.getDay();
  const diff = (dia === 0 ? -6 : 1 - dia);
  d.setDate(d.getDate() + diff);
  d.setHours(0,0,0,0);
  return d;
}
function getDiasDaSemana(offset){
  const segunda = getSegundaDaSemana(new Date());
  segunda.setDate(segunda.getDate() + offset*7);
  const dias = [];
  for (let i=0; i<6; i++){
    const d = new Date(segunda);
    d.setDate(segunda.getDate()+i);
    dias.push(d);
  }
  return dias;
}


function startApp(){
  document.getElementById("mes-resumo").value = mesAtual;

  document.getElementById("mes-resumo").addEventListener("change", (e)=>{
    mesAtual = e.target.value;
    renderResumo();
  });

  document.getElementById("novo-professor-nome").addEventListener("keydown", (e)=>{
    if (e.key === "Enter") adicionarProfessor();
  });

  db.collection("phenomPonto_professores").orderBy("nome")
    .onSnapshot((snap)=>{
      professores = snap.docs.map(d=>({id:d.id, ...d.data()}));
      renderSemana();
      renderProfessoresManage();
      renderResumo();
    }, (e)=> showStatus("Erro ao carregar professores: " + e.message, "error"));

  db.collection("phenomPonto_config").doc("geral")
    .onSnapshot((doc)=>{
      if (doc.exists){ valorHora = doc.data().valorHora ?? 25; }
      document.getElementById("valor-hora-input").value = valorHora;
      document.getElementById("valor-hora-display").textContent = "1h de aula = " + formatMoney(valorHora);
      renderResumo();
      renderSemana();
    }, (e)=> showStatus("Erro ao carregar valor/hora: " + e.message, "error"));

  window._registros = [];
  db.collection("phenomPonto_registros")
    .onSnapshot((snap)=>{
      window._registros = snap.docs.map(d=>d.data());
      renderResumo();
      renderSemana();
    }, (e)=> showStatus("Erro ao carregar registros: " + e.message, "error"));

  renderSemana();
}

// ---------- TABS ----------
function mudarTab(tab){
  ["registrar","professores","resumo"].forEach(t=>{
    document.getElementById("tab-"+t).style.display = (t===tab) ? "block" : "none";
  });
  document.querySelectorAll("nav.tabbar button").forEach(b=>{
    b.classList.toggle("active", b.dataset.tab === tab);
  });
  if (tab === "resumo") renderResumo();
}

// ---------- REGISTRAR (semanal) ----------
function mudarSemana(delta){ semanaOffset += delta; renderSemana(); }
function voltarSemanaAtual(){ semanaOffset = 0; renderSemana(); }

function renderSemana(){
  const dias = getDiasDaSemana(semanaOffset);
  const primeiro = dias[0], ultimo = dias[5];
  const labelEl = document.getElementById("semana-label");
  if (labelEl){
    labelEl.textContent = (primeiro.getMonth() === ultimo.getMonth())
      ? `Semana de ${primeiro.getDate()} a ${ultimo.getDate()} de ${NOMES_MES[ultimo.getMonth()]}`
      : `${primeiro.getDate()} de ${NOMES_MES[primeiro.getMonth()]} a ${ultimo.getDate()} de ${NOMES_MES[ultimo.getMonth()]}`;
  }

  const container = document.getElementById("semana-dias");
  if (!container) return;

  const ativos = professores.filter(p=>p.ativo !== false);
  if (ativos.length === 0){
    container.innerHTML = '<div class="empty">Nenhum professor cadastrado ainda.<br>Adicione na aba "Professores".</div>';
    document.getElementById("totais-semana").innerHTML = "";
    return;
  }

  const registros = window._registros || [];

  container.innerHTML = dias.map(d=>{
    const dateStr = dateToStr(d);
    const regsDoDia = {};
    registros.forEach(r=>{ if (r.data === dateStr) regsDoDia[r.professorId] = r; });

    const linhas = ativos.map(p=>{
      const reg = regsDoDia[p.id];
      const checked = !!reg;
      const horas = reg ? reg.horas : "";
      return `
        <div class="row">
          <div class="box ${checked ? "checked":""}" onclick="toggleCheckSemana('${p.id}','${dateStr}')">
            <svg viewBox="0 0 24 24" fill="none" stroke="#f4f1ea" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg>
          </div>
          <div class="row-name">${escapeHtml(p.nome)}</div>
          <input class="horas-field ${checked ? "active":""}" type="number" step="0.5" min="0"
            id="horas-${p.id}-${dateStr}" value="${horas}" placeholder="h"
            onchange="onHorasChangeSemana('${p.id}','${dateStr}')" />
        </div>`;
    }).join("");

    return `
      <div class="day-block">
        <div class="day-header">${DIAS_SEMANA[d.getDay()]} ${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}</div>
        ${linhas}
      </div>`;
  }).join("");

  renderTotaisSemana(dias);
}

function toggleCheckSemana(profId, dateStr){
  const registros = window._registros || [];
  const existente = registros.find(r=>r.professorId===profId && r.data===dateStr);
  salvarRegistroSemana(profId, dateStr, existente ? null : 2);
}

function onHorasChangeSemana(profId, dateStr){
  const input = document.getElementById(`horas-${profId}-${dateStr}`);
  const val = parseFloat(input.value);
  salvarRegistroSemana(profId, dateStr, (isNaN(val) || val <= 0) ? null : val);
}

function salvarRegistroSemana(profId, dateStr, horas){
  const docId = profId + "_" + dateStr;
  const ref = db.collection("phenomPonto_registros").doc(docId);
  if (horas === null){
    ref.delete().catch((e)=> showStatus("Erro ao remover o registro: " + e.message, "error"));
  } else {
    const prof = professores.find(p=>p.id===profId);
    ref.set({ professorId: profId, professorNome: prof ? prof.nome : "", data: dateStr, horas })
      .catch((e)=> showStatus("Erro ao salvar o registro: " + e.message, "error"));
  }
}

function renderTotaisSemana(dias){
  const dateStrs = dias.map(dateToStr);
  const registros = (window._registros || []).filter(r => dateStrs.includes(r.data));
  const porProfessor = {};
  registros.forEach(r=>{
    if (!porProfessor[r.professorId]) porProfessor[r.professorId] = { nome: r.professorNome || "?", horas: 0 };
    porProfessor[r.professorId].horas += r.horas;
  });
  const linhas = Object.values(porProfessor).sort((a,b)=> a.nome.localeCompare(b.nome));
  const box = document.getElementById("totais-semana");
  if (!box) return;
  box.innerHTML = linhas.length === 0
    ? '<div class="empty">Nenhum registro nesta semana.</div>'
    : linhas.map(l=>`
        <div class="weekly-total-row">
          <span>${escapeHtml(l.nome)}</span>
          <span class="val">${formatNum(l.horas)}h · ${formatMoney(l.horas * valorHora)}</span>
        </div>`).join("");
}

// ---------- PROFESSORES ----------
function adicionarProfessor(){
  const input = document.getElementById("novo-professor-nome");
  const nome = input.value.trim();
  if (!nome) return;
  db.collection("phenomPonto_professores").add({ nome, ativo: true, criadoEm: Date.now() })
    .then(()=>{ input.value = ""; })
    .catch((e)=> showStatus("Erro ao salvar o professor: " + e.message, "error"));
}

function arquivarProfessor(id, arquivar){
  db.collection("phenomPonto_professores").doc(id).update({ ativo: !arquivar })
    .catch((e)=> showStatus("Erro ao atualizar o professor: " + e.message, "error"));
}

function renderProfessoresManage(){
  const ativos = professores.filter(p=>p.ativo !== false);
  const arquivados = professores.filter(p=>p.ativo === false);

  const boxAtivos = document.getElementById("lista-professores-ativos");
  boxAtivos.innerHTML = ativos.length ? ativos.map(p=>`
    <div class="manage-row">
      <span>${escapeHtml(p.nome)}</span>
      <button class="link-btn" onclick="arquivarProfessor('${p.id}', true)">arquivar</button>
    </div>`).join("") : '<div class="empty">Nenhum professor ainda.</div>';

  const toggle = document.getElementById("toggle-arquivados");
  toggle.textContent = arquivados.length
    ? (arquivados.length===1 ? "Ver 1 professor arquivado" : "Ver " + arquivados.length + " professores arquivados")
    : "";
  toggle.style.display = arquivados.length ? "block" : "none";

  document.getElementById("lista-professores-arquivados").innerHTML = arquivados.map(p=>`
    <div class="manage-row">
      <span class="row-name dim">${escapeHtml(p.nome)}</span>
      <button class="link-btn muted" onclick="arquivarProfessor('${p.id}', false)">reativar</button>
    </div>`).join("");
}

function toggleArquivados(){
  const box = document.getElementById("lista-professores-arquivados");
  box.style.display = box.style.display === "none" ? "block" : "none";
}

function salvarValorHora(){
  const val = parseFloat(document.getElementById("valor-hora-input").value);
  if (isNaN(val) || val < 0) return;
  db.collection("phenomPonto_config").doc("geral").set({ valorHora: val })
    .catch((e)=> showStatus("Erro ao salvar o valor por hora: " + e.message, "error"));
}

// ---------- RESUMO ----------
function renderResumo(){
  if (!window._registros) return;
  const prefixo = mesAtual;
  const doMes = window._registros.filter(r => r.data && r.data.startsWith(prefixo));

  const porProfessor = {};
  doMes.forEach(r=>{
    if (!porProfessor[r.professorId]) porProfessor[r.professorId] = { nome: r.professorNome || "?", dias: 0, horas: 0 };
    porProfessor[r.professorId].dias += 1;
    porProfessor[r.professorId].horas += r.horas;
  });

  const linhas = Object.values(porProfessor).sort((a,b)=> a.nome.localeCompare(b.nome));
  const [ano, mes] = mesAtual.split("-");
  document.getElementById("resumo-mes-label").textContent = "RESUMO DE " + NOMES_MES[parseInt(mes,10)-1].toUpperCase() + "/" + ano;

  const box = document.getElementById("resumo-lista");
  box.innerHTML = linhas.length === 0
    ? '<div style="font-size:13px; opacity:0.7; padding:6px 0;">Nenhum registro neste mês.</div>'
    : linhas.map(l=>`
        <div class="month-row">
          <span>${escapeHtml(l.nome)} <span style="opacity:0.6;">(${l.dias}d, ${formatNum(l.horas)}h)</span></span>
          <span class="val">${formatMoney(l.horas * valorHora)}</span>
        </div>`).join("");

  const totalGeral = linhas.reduce((acc,l)=> acc + l.horas * valorHora, 0);
  document.getElementById("total-geral-valor").textContent = formatMoney(totalGeral);

  window._resumoAtual = linhas;
  window._totalGeralAtual = totalGeral;
}

function copiarResumoWhatsapp(){
  const linhas = window._resumoAtual || [];
  const [ano, mes] = mesAtual.split("-");
  const nomesMes = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
  let texto = `*Resumo Ponto Phenom — ${nomesMes[parseInt(mes,10)-1]}/${ano}*\n\n`;
  if (linhas.length === 0){
    texto += "Nenhum registro neste mês.";
  } else {
    linhas.forEach(l=>{
      texto += `${l.nome}: ${l.dias} dia(s), ${formatNum(l.horas)}h — ${formatMoney(l.horas*valorHora)}\n`;
    });
    texto += `\n*Total geral: ${formatMoney(window._totalGeralAtual)}*`;
  }
  navigator.clipboard.writeText(texto).then(()=>{
    alert("Resumo copiado! Cole no WhatsApp.");
  }).catch(()=>{
    alert("Não foi possível copiar automaticamente. Texto:\n\n" + texto);
  });
}

// ---------- HELPERS ----------
function formatMoney(v){
  return "R$ " + v.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function formatNum(v){
  return v.toLocaleString("pt-BR", { maximumFractionDigits: 1 });
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, (c)=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}
