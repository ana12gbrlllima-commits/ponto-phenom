<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Ponto Phenom</title>

<link rel="icon" href="icon-192.png" type="image/png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="manifest" href="manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Ponto Phenom" />
<meta name="theme-color" content="#16241c" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg: #e4ddc9;
    --ink: #2b2a25;
    --ink-dim: #8c8570;
    --line: #cdc4ac;
    --line-strong: #a89d80;
    --dark: #16241c;
    --dark-text: #f4f1ea;
    --accent: #c9762f;
    --danger: #a8433a;
    --danger-bg: #f6e3df;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'Space Mono', 'Courier New', monospace;
    min-height: 100vh;
    padding-bottom: 76px;
  }

  header{
    padding: 28px 20px 14px;
    text-align: center;
  }
  header .title{
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.08em;
  }
  header .subtitle{
    font-size: 12px;
    color: var(--ink-dim);
    margin-top: 6px;
  }

  .dashed{
    border: none;
    border-top: 1px dashed var(--line-strong);
    margin: 16px 20px;
  }
  .solid-line{
    border: none;
    border-top: 1px solid var(--line);
    margin: 0;
  }

  #status-line{
    display: none;
    margin: 0 20px 14px;
    padding: 10px 12px;
    border: 1px solid var(--danger);
    background: var(--danger-bg);
    color: var(--danger);
    font-size: 12px;
    border-radius: 8px;
    line-height: 1.5;
  }
  #status-line.show{ display: block; }
  #status-line.ok{
    border-color: #6f8f6a;
    background: #e7efe3;
    color: #3f5c3a;
  }

  main{ max-width: 540px; margin: 0 auto; padding: 0 20px; }

  nav.tabs{
    display: flex;
    justify-content: center;
    gap: 18px;
    font-size: 12px;
    letter-spacing: 0.06em;
    color: var(--ink-dim);
    margin-bottom: 6px;
  }
  nav.tabs button{
    background: none;
    border: none;
    font-family: inherit;
    font-size: 12px;
    letter-spacing: 0.06em;
    color: var(--ink-dim);
    cursor: pointer;
    padding: 6px 2px;
    border-bottom: 2px solid transparent;
  }
  nav.tabs button.active{
    color: var(--ink);
    font-weight: 700;
    border-bottom-color: var(--accent);
  }

  .week-nav{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin: 18px 0 4px;
  }
  .sq-btn{
    width: 32px; height: 32px;
    border: 1px solid var(--line-strong);
    background: var(--bg);
    color: var(--ink);
    border-radius: 6px;
    font-family: inherit;
    font-size: 16px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .sq-btn:active{ background: var(--line); }
  .week-label{
    font-size: 13px;
    text-align: center;
    min-width: 200px;
  }

  .pill-btn{
    display: block;
    margin: 12px auto 8px;
    border: 1px dashed var(--line-strong);
    background: transparent;
    color: var(--ink-dim);
    font-family: inherit;
    font-size: 12px;
    padding: 8px 16px;
    border-radius: 20px;
    cursor: pointer;
  }
  .pill-btn:active{ background: var(--line); }
  .pill-btn.last{ margin-bottom: 22px; }

  .day-block{
    margin-bottom: 16px;
    padding: 14px 14px 10px;
    border-radius: 12px;
  }
  .day-header{
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.08em;
    margin-bottom: 8px;
  }
  .row{
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 9px 0;
    border-bottom: 1px solid var(--line);
  }
  .row:last-child{ border-bottom: none; }

  .box{
    width: 18px; height: 18px;
    border: 1.5px solid var(--ink-dim);
    border-radius: 3px;
    flex-shrink: 0;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .box.checked{ background: var(--dark); border-color: var(--dark); }
  .box svg{ display:none; width: 12px; height: 12px; }
  .box.checked svg{ display: block; }

  .row-name{ flex: 1; font-size: 14px; }
  .row-name.dim{ color: var(--ink-dim); }

  .horas-field{
    width: 54px;
    text-align: right;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--line-strong);
    font-family: inherit;
    font-size: 14px;
    color: var(--ink);
    padding: 2px 2px;
    opacity: 0.3;
    pointer-events: none;
  }
  .horas-field.active{ opacity: 1; pointer-events: auto; }
  .horas-field:focus{ outline: none; border-bottom-color: var(--dark); }
  .row-hint{ font-size: 12px; color: var(--ink-dim); }

  .empty{
    text-align: center;
    color: var(--ink-dim);
    font-size: 13px;
    padding: 22px 10px;
  }

  .weekly-total-row{
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 8px 0;
    border-bottom: 1px solid var(--line);
    font-size: 13px;
  }
  .weekly-total-row:last-child{ border-bottom: none; }
  .weekly-total-row .val{ font-variant-numeric: tabular-nums; white-space: nowrap; }

  .month-box{
    background: var(--dark);
    color: var(--dark-text);
    border-radius: 12px;
    padding: 18px 20px;
    margin: 18px 0 24px;
  }
  .month-box .eyebrow{
    color: var(--accent);
    font-size: 11px;
    letter-spacing: 0.14em;
    margin-bottom: 10px;
  }
  .month-row{
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 7px 0;
    border-bottom: 1px solid rgba(244,241,234,0.15);
    font-size: 14px;
  }
  .month-row:last-child{ border-bottom: none; }
  .month-row .val{ font-variant-numeric: tabular-nums; white-space: nowrap; }
  .month-total{
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed rgba(244,241,234,0.3);
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: rgba(244,241,234,0.7);
  }

  .section-title{
    font-size: 12px;
    letter-spacing: 0.08em;
    color: var(--ink-dim);
    margin: 4px 0 12px;
  }

  input[type="month"]{
    background: var(--bg);
    border: 1px solid var(--line-strong);
    color: var(--ink);
    border-radius: 6px;
    padding: 9px 10px;
    font-size: 14px;
    font-family: inherit;
    width: 100%;
  }
  input[type="text"], input[type="number"]{
    background: var(--bg);
    border: 1px solid var(--line-strong);
    color: var(--ink);
    border-radius: 6px;
    padding: 9px 10px;
    font-size: 14px;
    font-family: inherit;
  }

  .add-row{ display: flex; gap: 8px; margin-bottom: 18px; }
  .add-row input{ flex: 1; }
  .add-row button{
    background: var(--dark);
    color: var(--dark-text);
    border: none;
    border-radius: 6px;
    padding: 0 16px;
    font-family: inherit;
    font-weight: 700;
    cursor: pointer;
  }

  .manage-row{
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 9px 0;
    border-bottom: 1px solid var(--line);
    font-size: 14px;
  }
  .manage-row:last-child{ border-bottom: none; }
  .manage-actions{ display:flex; align-items:center; gap:10px; }
  .link-btn{
    background: none;
    border: none;
    font-family: inherit;
    font-size: 12px;
    color: var(--danger);
    text-decoration: underline;
    cursor: pointer;
    padding: 4px;
  }
  .link-btn.muted{ color: var(--accent); }
  .trash-btn{
    background: none;
    border: none;
    font-size: 15px;
    cursor: pointer;
    color: var(--danger);
    padding: 2px 4px;
    line-height: 1;
  }

  .day-toggles{
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
    margin: 6px 0 12px;
  }
  .day-toggle{
    font-size: 10px;
    letter-spacing: 0.04em;
    padding: 4px 7px;
    border: 1px solid var(--line-strong);
    border-radius: 5px;
    cursor: pointer;
    color: var(--ink-dim);
    background: var(--bg);
    font-family: inherit;
  }
  .day-toggle.on{
    background: var(--dark);
    color: var(--dark-text);
    border-color: var(--dark);
  }

  .add-day-select{
    width: 100%;
    background: var(--bg);
    border: 1px dashed var(--line-strong);
    color: var(--ink-dim);
    border-radius: 8px;
    padding: 8px 10px;
    font-family: inherit;
    font-size: 12px;
    margin-top: 4px;
  }

  .archived-toggle{
    font-size: 12px;
    color: var(--ink-dim);
    text-decoration: underline;
    cursor: pointer;
    margin-top: 4px;
  }

  table.resumo{
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    margin-bottom: 6px;
  }
  table.resumo th{
    text-align: left;
    color: var(--ink-dim);
    font-weight: 400;
    font-size: 11px;
    letter-spacing: 0.05em;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--line-strong);
  }
  table.resumo td{
    padding: 8px 0;
    border-bottom: 1px solid var(--line);
  }
  table.resumo td.num{ text-align: right; font-variant-numeric: tabular-nums; }

  .whatsapp-btn{
    display: block;
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--line-strong);
    color: var(--ink);
    font-family: inherit;
    font-size: 13px;
    padding: 12px;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 30px;
  }

  .prof-group{ margin-bottom: 6px; }
  .prof-group-name{
    font-size: 14px;
    font-weight: 700;
    margin: 12px 0 2px;
    letter-spacing: 0.02em;
  }
  .lanc-item-row{
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 0 7px 6px;
    border-bottom: 1px solid var(--line);
  }
  .lanc-item-row:last-child{ border-bottom: none; }
  .lanc-turma-only{ flex: 1; min-width: 0; font-size: 13px; color: var(--ink); }
  .lanc-aulas{
    width: 56px;
    text-align: center;
    background: transparent;
    border: 1px solid var(--line-strong);
    border-radius: 5px;
    font-family: inherit;
    font-size: 13px;
    color: var(--ink);
    padding: 5px 2px;
    -moz-appearance: textfield;
  }
  .lanc-aulas::-webkit-outer-spin-button,
  .lanc-aulas::-webkit-inner-spin-button{
    -webkit-appearance: none;
    margin: 0;
  }
  .lanc-aulas:focus{ outline: none; border-color: var(--dark); }

  .add-lanc-row{
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--line-strong);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .add-lanc-row select, .add-lanc-row input{
    background: var(--bg);
    border: 1px solid var(--line-strong);
    color: var(--ink);
    border-radius: 6px;
    padding: 8px 9px;
    font-family: inherit;
    font-size: 13px;
  }
  .add-lanc-fields{ display: flex; gap: 6px; }
  .add-lanc-fields input.add-turma{ flex: 1; min-width: 0; }
  .add-lanc-fields input.add-aulas{
    width: 56px;
    text-align: center;
    -moz-appearance: textfield;
  }
  .add-lanc-fields input.add-aulas::-webkit-outer-spin-button,
  .add-lanc-fields input.add-aulas::-webkit-inner-spin-button{
    -webkit-appearance: none;
    margin: 0;
  }
  .add-lanc-fields button{
    background: var(--dark);
    color: var(--dark-text);
    border: none;
    border-radius: 6px;
    width: 36px;
    font-family: inherit;
    font-weight: 700;
    cursor: pointer;
  }

  nav.tabbar{
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--bg);
    border-top: 1px solid var(--line-strong);
    display: flex;
    justify-content: center;
    gap: 26px;
    padding: 12px 8px calc(12px + env(safe-area-inset-bottom));
  }
  nav.tabbar button{
    background: none;
    border: none;
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--ink-dim);
    cursor: pointer;
    padding: 4px 2px;
  }
  nav.tabbar button.active{ color: var(--dark); font-weight: 700; }
</style>
</head>
<body>

<div id="login-screen" style="max-width:360px; margin:60px auto; padding:0 24px; text-align:center;">
  <div class="title" style="margin-bottom:24px;">🕐 PONTO PHENOM</div>
  <input type="email" id="login-email" placeholder="E-mail" style="width:100%; margin-bottom:10px;" />
  <input type="password" id="login-senha" placeholder="Senha" style="width:100%; margin-bottom:14px;" onkeydown="if(event.key==='Enter') fazerLogin()" />
  <button class="whatsapp-btn" style="background:var(--dark); color:var(--dark-text); border:none;" onclick="fazerLogin()">Entrar</button>
  <div id="login-erro" style="color:var(--danger); font-size:12px; margin-top:10px;"></div>
</div>

<div id="app" style="display:none;">
  <header>
    <div class="title">🕐 PONTO PHENOM</div>
    <div class="subtitle" id="valor-hora-display"></div>
    <div class="archived-toggle" style="margin-top:8px;" onclick="fazerLogout()">sair</div>
  </header>

  <div id="status-line"></div>

  <hr class="dashed" />

  <main>
    <!-- REGISTRAR -->
    <section id="tab-registrar">
      <div class="week-nav">
        <button class="sq-btn" onclick="mudarSemana(-1)">‹</button>
        <div class="week-label" id="semana-label"></div>
        <button class="sq-btn" onclick="mudarSemana(1)">›</button>
      </div>
      <button class="pill-btn" onclick="voltarSemanaAtual()">voltar para semana atual</button>
      <button class="pill-btn last" style="border-color:var(--danger); color:var(--danger);" onclick="limparSemana()">limpar tudo desta semana</button>

      <div id="semana-dias"></div>
      <datalist id="turmas-datalist"></datalist>

      <div class="section-title">TOTAL DA SEMANA POR PROFESSOR</div>
      <div id="totais-semana" style="margin-bottom: 30px;"></div>
    </section>

    <!-- PROFESSORES -->
    <section id="tab-professores" style="display:none;">
      <div class="section-title">ADICIONAR PROFESSOR</div>
      <div class="add-row">
        <input type="text" id="novo-professor-nome" placeholder="Nome do professor" />
        <button onclick="adicionarProfessor()">+</button>
      </div>

      <div id="lista-professores-ativos"></div>
      <div class="archived-toggle" id="toggle-arquivados" onclick="toggleArquivados()">Ver professores arquivados</div>
      <div id="lista-professores-arquivados" style="display:none;"></div>
    </section>

    <!-- RESUMO -->
    <section id="tab-resumo" style="display:none;">
      <div class="section-title">MÊS</div>
      <input type="month" id="mes-resumo" style="margin-bottom: 14px;" />

      <div class="section-title">PROFESSOR</div>
      <select id="filtro-professor-resumo" style="margin-bottom: 18px;">
        <option value="">Todos os professores</option>
      </select>

      <div class="month-box">
        <div class="eyebrow" id="resumo-mes-label">RESUMO DO MÊS</div>
        <div id="resumo-lista"></div>
        <div class="month-total" id="resumo-total-linha">
          <span>total geral da escola</span>
          <span id="total-geral-valor">R$ 0,00</span>
        </div>
      </div>

      <button class="whatsapp-btn" onclick="copiarResumoWhatsapp()">Copiar resumo para WhatsApp</button>
    </section>
  </main>

  <nav class="tabbar">
    <button class="active" data-tab="registrar" onclick="mudarTab('registrar')">REGISTRAR</button>
    <button data-tab="professores" onclick="mudarTab('professores')">PROFESSORES</button>
    <button data-tab="resumo" onclick="mudarTab('resumo')">RESUMO</button>
  </nav>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js", { updateViaCache: "none" }).catch(()=>{}));
}

// ---------- STATUS BANNER ----------
function showStatus(msg, kind){
  const el = document.getElementById("status-line");
  el.textContent = msg;
  el.classList.remove("ok");
  if (kind === "ok") el.classList.add("ok");
  el.classList.add("show");
}
function hideStatus(){
  const el = document.getElementById("status-line");
  el.classList.remove("show");
}

// ---------- STATE ----------
let professores = [];
const VALOR_HORA = 25;
let semanaOffset = 0;
const DIAS_SEMANA = ["DOMINGO","SEGUNDA","TERÇA","QUARTA","QUINTA","SEXTA","SÁBADO"];
const DIAS_ABREV = ["DOM","SEG","TER","QUA","QUI","SEX","SÁB"];
const NOMES_MES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];

const PALETA_CORES = ["#1f4e79", "#8a2246", "#2d6a4f", "#8a4b08", "#4c3575", "#0f6674", "#8c3a1f", "#5c5c1f", "#1f5c8a", "#6b2d5c"];
function corProfessor(id){
  let hash = 0;
  for (let i=0; i<id.length; i++){ hash = (hash*31 + id.charCodeAt(i)) >>> 0; }
  return PALETA_CORES[hash % PALETA_CORES.length];
}

const CORES_DIA = {
  1: "#efe5d2", // segunda
  2: "#e1e6cf", // terça
  3: "#e9dfe9", // quarta
  4: "#d9e6e2", // quinta
  5: "#ecdccb", // sexta
  6: "#dcdce8", // sábado
};

function mesStr(){
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
}
let mesAtual = mesStr();

// ---------- FIREBASE SETUP ----------
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBDvBP9ycd3Zfj3yHDw03BrCXjmJNAp4xA",
  authDomain: "phenom-ponto.firebaseapp.com",
  projectId: "phenom-ponto",
  storageBucket: "phenom-ponto.firebasestorage.app",
  messagingSenderId: "975759698842",
  appId: "1:975759698842:web:0bd5ecba80b756c88d2823"
};

let db;

let auth;

(function boot(){
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.firestore();
    auth = firebase.auth();

    auth.onAuthStateChanged((user)=>{
      if (user){
        document.getElementById("login-screen").style.display = "none";
        document.getElementById("app").style.display = "block";
        startApp();
        db.collection("phenomPonto_diagnostico").doc("teste").set({ ok: true, quando: Date.now() })
          .then(()=> hideStatus())
          .catch((e)=> showStatus("Erro de permissão no Firestore: " + e.message, "error"));
      } else {
        document.getElementById("app").style.display = "none";
        document.getElementById("login-screen").style.display = "block";
      }
    });
  }catch(e){
    showStatus("Não consegui conectar ao Firebase: " + e.message, "error");
  }
})();

function fazerLogin(){
  const email = document.getElementById("login-email").value.trim();
  const senha = document.getElementById("login-senha").value;
  const erroEl = document.getElementById("login-erro");
  erroEl.textContent = "";
  if (!email || !senha){ erroEl.textContent = "Preencha e-mail e senha."; return; }
  auth.signInWithEmailAndPassword(email, senha)
    .catch((e)=>{ erroEl.textContent = "Não consegui entrar: " + e.message; });
}

function fazerLogout(){
  auth.signOut();
}

function dateToStr(d){
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function getSegundaDaSemana(date){
  const d = new Date(date);
  const dia = d.getDay();
  const diff = (dia === 0 ? -6 : 1 - dia);
  d.setDate(d.getDate() + diff);
  d.setHours(0,0,0,0);
  return d;
}
function getDiasDaSemana(offset){
  const segunda = getSegundaDaSemana(new Date());
  segunda.setDate(segunda.getDate() + offset*7);
  const dias = [];
  for (let i=0; i<6; i++){
    const d = new Date(segunda);
    d.setDate(segunda.getDate()+i);
    dias.push(d);
  }
  return dias;
}


function startApp(){
  document.getElementById("mes-resumo").value = mesAtual;

  document.getElementById("mes-resumo").addEventListener("change", (e)=>{
    mesAtual = e.target.value;
    renderResumo();
  });

  document.getElementById("filtro-professor-resumo").addEventListener("change", ()=>{
    renderResumo();
  });

  document.getElementById("novo-professor-nome").addEventListener("keydown", (e)=>{
    if (e.key === "Enter") adicionarProfessor();
  });

  db.collection("phenomPonto_professores").orderBy("nome")
    .onSnapshot((snap)=>{
      professores = snap.docs.map(d=>({id:d.id, ...d.data()}));
      renderSemana();
      renderProfessoresManage();
      renderFiltroProfessorOptions();
      renderResumo();
    }, (e)=> showStatus("Erro ao carregar professores: " + e.message, "error"));

  document.getElementById("valor-hora-display").textContent = "1h de aula = " + formatMoney(VALOR_HORA);

  window._registros = [];
  db.collection("phenomPonto_registros")
    .onSnapshot((snap)=>{
      window._registros = snap.docs.map(d=>({id:d.id, ...d.data()}));
      renderResumo();
      renderSemana();
    }, (e)=> showStatus("Erro ao carregar registros: " + e.message, "error"));

  window._turmas = [];
  db.collection("phenomPonto_turmas").orderBy("nome")
    .onSnapshot((snap)=>{
      window._turmas = snap.docs.map(d=>({id:d.id, ...d.data()}));
      const datalist = document.getElementById("turmas-datalist");
      if (datalist){
        datalist.innerHTML = window._turmas.map(t=>`<option value="${escapeHtml(t.nome)}"></option>`).join("");
      }
    }, (e)=> showStatus("Erro ao carregar turmas: " + e.message, "error"));

  renderSemana();
}

// ---------- TABS ----------
function mudarTab(tab){
  ["registrar","professores","resumo"].forEach(t=>{
    document.getElementById("tab-"+t).style.display = (t===tab) ? "block" : "none";
  });
  document.querySelectorAll("nav.tabbar button").forEach(b=>{
    b.classList.toggle("active", b.dataset.tab === tab);
  });
  if (tab === "resumo") renderResumo();
}

// ---------- REGISTRAR (semanal) ----------
function mudarSemana(delta){ semanaOffset += delta; renderSemana(); }
function voltarSemanaAtual(){ semanaOffset = 0; renderSemana(); }

function limparSemana(){
  const dias = getDiasDaSemana(semanaOffset);
  const dateStrs = dias.map(dateToStr);
  const registrosDaSemana = (window._registros || []).filter(r => dateStrs.includes(r.data));

  if (registrosDaSemana.length === 0){
    showStatus("Não há nenhum lançamento nesta semana pra apagar.", "ok");
    return;
  }
  if (!confirm(`Apagar TODOS os ${registrosDaSemana.length} lançamento(s) desta semana? Isso não pode ser desfeito.`)) return;

  const batch = db.batch();
  registrosDaSemana.forEach(r => batch.delete(db.collection("phenomPonto_registros").doc(r.id)));
  batch.commit().catch((e)=> showStatus("Erro ao limpar a semana: " + e.message, "error"));
}

function renderSemana(){
  const dias = getDiasDaSemana(semanaOffset);
  const primeiro = dias[0], ultimo = dias[5];
  const labelEl = document.getElementById("semana-label");
  if (labelEl){
    labelEl.textContent = (primeiro.getMonth() === ultimo.getMonth())
      ? `Semana de ${primeiro.getDate()} a ${ultimo.getDate()} de ${NOMES_MES[ultimo.getMonth()]}`
      : `${primeiro.getDate()} de ${NOMES_MES[primeiro.getMonth()]} a ${ultimo.getDate()} de ${NOMES_MES[ultimo.getMonth()]}`;
  }

  const container = document.getElementById("semana-dias");
  if (!container) return;

  const ativos = professores.filter(p=>p.ativo !== false);
  if (ativos.length === 0){
    container.innerHTML = '<div class="empty">Nenhum professor cadastrado ainda.<br>Adicione na aba "Professores".</div>';
    document.getElementById("totais-semana").innerHTML = "";
    return;
  }

  const registros = window._registros || [];
  const optionsProf = ativos.map(p=>`<option value="${p.id}">${escapeHtml(p.nome)}</option>`).join("");

  container.innerHTML = dias.map(d=>{
    const dateStr = dateToStr(d);
    const weekday = d.getDay();
    const lancamentosDoDia = registros.filter(r => r.data === dateStr);

    const porProfessorNoDia = {};
    lancamentosDoDia.forEach(r=>{
      if (!porProfessorNoDia[r.professorId]) porProfessorNoDia[r.professorId] = { nome: r.professorNome || "?", itens: [] };
      porProfessorNoDia[r.professorId].itens.push(r);
    });
    const gruposOrdenados = Object.entries(porProfessorNoDia).sort((a,b)=> a[1].nome.localeCompare(b[1].nome));

    const linhas = gruposOrdenados.map(([profId, grupo])=>{
      const cor = corProfessor(profId);
      const itens = grupo.itens.map(r=>`
        <div class="lanc-item-row">
          <div class="lanc-turma-only">${escapeHtml(r.turmaNome || "sem turma")}</div>
          <input class="lanc-aulas" type="number" min="0" step="0.5" value="${r.horas}"
            onchange="onEditHorasLancamento('${r.id}', this)" />
          <button class="trash-btn" title="Remover" onclick="removerLancamento('${r.id}')">🗑</button>
        </div>`).join("");
      return `
        <div class="prof-group">
          <div class="prof-group-name" style="color:${cor};">${escapeHtml(grupo.nome)}</div>
          ${itens}
        </div>`;
    }).join("");

    return `
      <div class="day-block" style="background:${CORES_DIA[weekday] || "transparent"};">
        <div class="day-header">${DIAS_SEMANA[weekday]} ${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}</div>
        ${linhas || '<div class="row-hint" style="padding:6px 0;">Nenhum lançamento neste dia.</div>'}
        <div class="add-lanc-row">
          <select id="add-prof-${dateStr}">
            <option value="">Professor</option>
            ${optionsProf}
          </select>
          <div class="add-lanc-fields">
            <input class="add-turma" list="turmas-datalist" id="add-turma-${dateStr}" placeholder="Turma" />
            <input class="add-aulas" type="number" id="add-horas-${dateStr}" min="0.5" step="0.5" value="1" title="Duração em horas" />
            <button onclick="adicionarLancamento('${dateStr}')">+</button>
          </div>
        </div>
      </div>`;
  }).join("");

  renderTotaisSemana(dias);
}

function adicionarLancamento(dateStr){
  const profSel = document.getElementById(`add-prof-${dateStr}`);
  const turmaInput = document.getElementById(`add-turma-${dateStr}`);
  const horasInput = document.getElementById(`add-horas-${dateStr}`);
  const profId = profSel.value;
  const turmaNome = turmaInput.value.trim();
  const horas = parseFloat(horasInput.value);

  if (!profId){ showStatus("Escolha o professor antes de adicionar.", "error"); return; }
  if (!turmaNome){ showStatus("Escreva o nome da turma antes de adicionar.", "error"); return; }
  if (isNaN(horas) || horas <= 0){ showStatus("Informe quantas horas essa aula durou.", "error"); return; }

  const prof = professores.find(p=>p.id===profId);

  garantirTurma(turmaNome).then((turmaId)=>{
    db.collection("phenomPonto_registros").add({
      professorId: profId,
      professorNome: prof ? prof.nome : "",
      turmaId: turmaId || null,
      turmaNome: turmaNome,
      data: dateStr,
      horas: horas
    }).then(()=>{
      turmaInput.value = "";
      horasInput.value = "1";
    }).catch((e)=> showStatus("Erro ao salvar a aula: " + e.message, "error"));
  });
}

function garantirTurma(nome){
  const existente = (window._turmas || []).find(t => t.nome.toLowerCase() === nome.toLowerCase());
  if (existente) return Promise.resolve(existente.id);
  return db.collection("phenomPonto_turmas").add({ nome, criadoEm: Date.now() })
    .then(ref => ref.id)
    .catch((e)=>{ showStatus("Erro ao salvar a turma: " + e.message, "error"); return null; });
}

function onEditHorasLancamento(id, inputEl){
  const val = parseFloat(inputEl.value);
  if (isNaN(val) || val <= 0){
    removerLancamento(id);
    return;
  }
  db.collection("phenomPonto_registros").doc(id).update({ horas: val })
    .catch((e)=> showStatus("Erro ao atualizar a aula: " + e.message, "error"));
}

function removerLancamento(id){
  db.collection("phenomPonto_registros").doc(id).delete()
    .catch((e)=> showStatus("Erro ao remover a aula: " + e.message, "error"));
}

function renderTotaisSemana(dias){
  const dateStrs = dias.map(dateToStr);
  const registros = (window._registros || []).filter(r => dateStrs.includes(r.data));
  const porProfessor = {};
  registros.forEach(r=>{
    if (!porProfessor[r.professorId]) porProfessor[r.professorId] = { nome: r.professorNome || "?", horas: 0 };
    porProfessor[r.professorId].horas += r.horas;
  });
  const linhas = Object.entries(porProfessor).sort((a,b)=> a[1].nome.localeCompare(b[1].nome));
  const box = document.getElementById("totais-semana");
  if (!box) return;
  box.innerHTML = linhas.length === 0
    ? '<div class="empty">Nenhum registro nesta semana.</div>'
    : linhas.map(([profId, l])=>`
        <div class="weekly-total-row">
          <span style="color:${corProfessor(profId)}; font-weight:700;">${escapeHtml(l.nome)}</span>
          <span class="val">${formatNum(l.horas)}h · ${formatMoney(l.horas * VALOR_HORA)}</span>
        </div>`).join("");
}

// ---------- PROFESSORES ----------
function adicionarProfessor(){
  const input = document.getElementById("novo-professor-nome");
  const nome = input.value.trim();
  if (!nome) return;
  db.collection("phenomPonto_professores").add({ nome, ativo: true, criadoEm: Date.now() })
    .then(()=>{ input.value = ""; })
    .catch((e)=> showStatus("Erro ao salvar o professor: " + e.message, "error"));
}

function arquivarProfessor(id, arquivar){
  db.collection("phenomPonto_professores").doc(id).update({ ativo: !arquivar })
    .catch((e)=> showStatus("Erro ao atualizar o professor: " + e.message, "error"));
}

function excluirProfessor(id, nome){
  if (!confirm(`Excluir "${nome}" definitivamente? Isso não pode ser desfeito (os registros já lançados no histórico permanecem).`)) return;
  db.collection("phenomPonto_professores").doc(id).delete()
    .catch((e)=> showStatus("Erro ao excluir o professor: " + e.message, "error"));
}

function renderProfessoresManage(){
  const ativos = professores.filter(p=>p.ativo !== false);
  const arquivados = professores.filter(p=>p.ativo === false);

  const boxAtivos = document.getElementById("lista-professores-ativos");
  boxAtivos.innerHTML = ativos.length ? ativos.map(p=>`
    <div class="manage-row">
      <span style="color:${corProfessor(p.id)}; font-weight:700;">${escapeHtml(p.nome)}</span>
      <button class="link-btn" onclick="arquivarProfessor('${p.id}', true)">arquivar</button>
    </div>`).join("") : '<div class="empty">Nenhum professor ainda.</div>';

  const toggle = document.getElementById("toggle-arquivados");
  toggle.textContent = arquivados.length
    ? (arquivados.length===1 ? "Ver 1 professor arquivado" : "Ver " + arquivados.length + " professores arquivados")
    : "";
  toggle.style.display = arquivados.length ? "block" : "none";

  document.getElementById("lista-professores-arquivados").innerHTML = arquivados.map(p=>`
    <div class="manage-row">
      <span class="row-name dim">${escapeHtml(p.nome)}</span>
      <div class="manage-actions">
        <button class="link-btn muted" onclick="arquivarProfessor('${p.id}', false)">reativar</button>
        <button class="trash-btn" title="Excluir definitivamente" onclick="excluirProfessor('${p.id}', '${escapeHtml(p.nome).replace(/'/g,"\\'")}')">🗑</button>
      </div>
    </div>`).join("");
}

function toggleArquivados(){
  const box = document.getElementById("lista-professores-arquivados");
  box.style.display = box.style.display === "none" ? "block" : "none";
}

function renderFiltroProfessorOptions(){
  const select = document.getElementById("filtro-professor-resumo");
  if (!select) return;
  const atual = select.value;
  const ordenados = [...professores].sort((a,b)=> a.nome.localeCompare(b.nome));
  select.innerHTML = '<option value="">Todos os professores</option>' +
    ordenados.map(p=>`<option value="${p.id}">${escapeHtml(p.nome)}${p.ativo === false ? " (arquivado)" : ""}</option>`).join("");
  if (ordenados.some(p=>p.id === atual)) select.value = atual;
}

// ---------- RESUMO ----------
function renderResumo(){
  if (!window._registros) return;
  const prefixo = mesAtual;
  const doMes = window._registros.filter(r => r.data && r.data.startsWith(prefixo));
  const [ano, mes] = mesAtual.split("-");
  const nomeMes = NOMES_MES[parseInt(mes,10)-1].toUpperCase() + "/" + ano;

  const filtroSelect = document.getElementById("filtro-professor-resumo");
  const profId = filtroSelect ? filtroSelect.value : "";

  if (profId){
    // ---- relatório detalhado de UM professor ----
    const doProfessor = doMes.filter(r => r.professorId === profId).sort((a,b)=> a.data.localeCompare(b.data));
    const prof = professores.find(p=>p.id===profId);
    const nomeProf = prof ? prof.nome : (doProfessor[0] ? doProfessor[0].professorNome : "?");

    document.getElementById("resumo-mes-label").textContent = "RESUMO DE " + nomeMes + " — " + nomeProf.toUpperCase();

    const box = document.getElementById("resumo-lista");
    box.innerHTML = doProfessor.length === 0
      ? '<div style="font-size:13px; opacity:0.7; padding:6px 0;">Nenhum registro neste mês.</div>'
      : doProfessor.map(r=>{
          const [, , dia] = r.data.split("-");
          return `
            <div class="month-row">
              <span>${dia}/${mes} <span style="opacity:0.6;">— ${escapeHtml(r.turmaNome || "sem turma")}</span></span>
              <span class="val">${formatNum(r.horas)}h · ${formatMoney(r.horas * VALOR_HORA)}</span>
            </div>`;
        }).join("");

    const totalHoras = doProfessor.reduce((acc,r)=> acc + r.horas, 0);
    const totalValor = totalHoras * VALOR_HORA;
    document.getElementById("resumo-total-linha").querySelector("span:first-child").textContent =
      `total de ${nomeProf.split(" ")[0].toLowerCase()} (${formatNum(totalHoras)}h)`;
    document.getElementById("total-geral-valor").textContent = formatMoney(totalValor);

    window._resumoModo = "professor";
    window._resumoProfessorNome = nomeProf;
    window._resumoProfessorLinhas = doProfessor;
    window._totalGeralAtual = totalValor;
    return;
  }

  // ---- visão geral, todos os professores ----
  const porProfessor = {};
  doMes.forEach(r=>{
    if (!porProfessor[r.professorId]) porProfessor[r.professorId] = { nome: r.professorNome || "?", diasSet: new Set(), horas: 0 };
    porProfessor[r.professorId].diasSet.add(r.data);
    porProfessor[r.professorId].horas += r.horas;
  });

  const linhas = Object.values(porProfessor).map(p=>({ nome: p.nome, dias: p.diasSet.size, horas: p.horas })).sort((a,b)=> a.nome.localeCompare(b.nome));
  document.getElementById("resumo-mes-label").textContent = "RESUMO DE " + nomeMes;

  const box = document.getElementById("resumo-lista");
  box.innerHTML = linhas.length === 0
    ? '<div style="font-size:13px; opacity:0.7; padding:6px 0;">Nenhum registro neste mês.</div>'
    : linhas.map(l=>`
        <div class="month-row">
          <span>${escapeHtml(l.nome)} <span style="opacity:0.6;">(${l.dias}d, ${formatNum(l.horas)}h)</span></span>
          <span class="val">${formatMoney(l.horas * VALOR_HORA)}</span>
        </div>`).join("");

  const totalGeral = linhas.reduce((acc,l)=> acc + l.horas * VALOR_HORA, 0);
  document.getElementById("resumo-total-linha").querySelector("span:first-child").textContent = "total geral da escola";
  document.getElementById("total-geral-valor").textContent = formatMoney(totalGeral);

  window._resumoModo = "todos";
  window._resumoAtual = linhas;
  window._totalGeralAtual = totalGeral;
}

function copiarResumoWhatsapp(){
  const [ano, mes] = mesAtual.split("-");
  const nomesMes = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
  const nomeMes = nomesMes[parseInt(mes,10)-1] + "/" + ano;
  let texto;

  if (window._resumoModo === "professor"){
    const linhas = window._resumoProfessorLinhas || [];
    const nomeProf = window._resumoProfessorNome || "Professor";
    texto = `*Resumo Ponto Phenom — ${nomeProf} — ${nomeMes}*\n\n`;
    if (linhas.length === 0){
      texto += "Nenhum registro neste mês.";
    } else {
      linhas.forEach(r=>{
        const [, , dia] = r.data.split("-");
        texto += `${dia}/${mes} — ${r.turmaNome || "sem turma"}: ${formatNum(r.horas)}h — ${formatMoney(r.horas*VALOR_HORA)}\n`;
      });
      texto += `\n*Total a receber: ${formatMoney(window._totalGeralAtual)}*`;
    }
  } else {
    const linhas = window._resumoAtual || [];
    texto = `*Resumo Ponto Phenom — ${nomeMes}*\n\n`;
    if (linhas.length === 0){
      texto += "Nenhum registro neste mês.";
    } else {
      linhas.forEach(l=>{
        texto += `${l.nome}: ${l.dias} dia(s), ${formatNum(l.horas)}h — ${formatMoney(l.horas*VALOR_HORA)}\n`;
      });
      texto += `\n*Total geral: ${formatMoney(window._totalGeralAtual)}*`;
    }
  }

  navigator.clipboard.writeText(texto).then(()=>{
    alert("Resumo copiado! Cole no WhatsApp.");
  }).catch(()=>{
    alert("Não foi possível copiar automaticamente. Texto:\n\n" + texto);
  });
}

// ---------- HELPERS ----------
function formatMoney(v){
  return "R$ " + v.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function formatNum(v){
  return v.toLocaleString("pt-BR", { maximumFractionDigits: 1 });
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, (c)=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}
